<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotspot Login - TKJ Network Terminal</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * { 

            margin: 0; 

            padding: 0; 

            box-sizing: border-box; 

        }

        

        body {

            background-color: #07090e;

            background-image: 

                radial-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),

                linear-gradient(to right, rgba(16, 185, 129, 0.02) 1px, transparent 1px);

            background-size: 24px 24px;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            color: #f8fafc;

            font-family: 'Plus Jakarta Sans', sans-serif;

        }



        .container {

            background: #0d1322;

            border: 1px solid #1e293b;

            border-top: 3px solid #00f2fe;

            border-radius: 12px;

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 242, 254, 0.05);

            padding: 36px;

            max-width: 420px;

            width: 100%;

            position: relative;

        }



        /* Terminal Top Bar Effect */

        .terminal-bar {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 24px;

            padding-bottom: 12px;

            border-bottom: 1px solid #1e293b;

        }



        .terminal-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

        }

        .dot-red { background: #ef4444; }

        .dot-yellow { background: #f59e0b; }

        .dot-green { background: #10b981; }



        .terminal-title {

            margin-left: auto;

            font-family: 'JetBrains Mono', monospace;

            font-size: 10px;

            color: #64748b;

            letter-spacing: 0.1em;

            text-transform: uppercase;

        }



        .header { 

            text-align: center; 

            margin-bottom: 28px; 

        }

        

        .header h1 { 

            color: #f8fafc; 

            font-size: 20px; 

            font-weight: 700; 

            margin-bottom: 6px; 

            letter-spacing: -0.02em;

        }

        

        .header p { 

            color: #38bdf8; 

            font-size: 11px; 

            font-weight: 600;

            font-family: 'JetBrains Mono', monospace;

            text-transform: uppercase; 

            letter-spacing: 0.1em; 

        }

        

        /* Cyber Icon Core */

        .racing-icon {

            width: 56px; 

            height: 56px; 

            margin: 0 auto 16px;

            background: rgba(0, 242, 254, 0.08);

            color: #00f2fe;

            border: 1px solid rgba(0, 242, 254, 0.2);

            border-radius: 12px; 

            display: flex; 

            justify-content: center; 

            align-items: center; 

            font-size: 24px;

            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);

        }



        .form-group { 

            margin-bottom: 16px; 

        }

        

        .form-group label { 

            display: block; 

            margin-bottom: 6px; 

            color: #94a3b8; 

            font-weight: 600; 

            font-size: 11px;

            font-family: 'JetBrains Mono', monospace;

            text-transform: uppercase;

            letter-spacing: 0.05em;

        }

        

        .form-group input {

            width: 100%; 

            padding: 12px 16px; 

            background: #07090e; 

            border: 1px solid #1e293b;

            border-radius: 8px; 

            font-size: 13px; 

            font-family: 'JetBrains Mono', monospace;

            color: #f8fafc; 

            outline: none; 

            transition: all 0.2s ease;

        }

        

        .form-group input:focus { 

            border-color: #00f2fe; 

            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15); 

            background: #040609;

        }



        .btn {

            width: 100%; 

            padding: 12px; 

            background: linear-gradient(135deg, #00f2fe 0%, #3b82f6 100%);

            color: #07090e; 

            border: none; 

            border-radius: 8px; 

            font-size: 12px; 

            font-weight: 700;

            font-family: 'JetBrains Mono', monospace;

            text-transform: uppercase;

            letter-spacing: 0.1em;

            cursor: pointer;

            transition: opacity 0.2s ease, transform 0.1s ease;

            margin-top: 4px;

        }

        

        .btn:hover { opacity: 0.9; }

        .btn:active { transform: scale(0.99); }

        .btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }

        

        .message { 

            padding: 12px 16px; 

            border-radius: 8px; 

            margin-top: 16px; 

            display: none; 

            font-size: 11px; 

            font-weight: 500;

            font-family: 'JetBrains Mono', monospace;

        }

        .message.success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .message.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .message.info { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

        

        .register-link { text-align: center; margin-top: 20px; color: #64748b; font-size: 12px; }

        .register-link a { color: #00f2fe; text-decoration: none; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

        .register-link a:hover { text-decoration: underline; }

        

        .loading {

            display: inline-block; width: 10px; height: 10px;

            border: 2px solid rgba(7, 9, 14, 0.3); border-radius: 50%; border-top-color: #07090e;

            animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle;

        }

        @keyframes spin { to { transform: rotate(360deg); } }

        

        .status-check { margin-top: 16px; padding: 16px; background: #07090e; border: 1px solid #1e293b; border-radius: 8px; display: none; }

        .status-check.show { display: block; }

        .status-check input { width: calc(100% - 60px); padding: 10px 12px; background: #0d1322; border: 1px solid #1e293b; border-radius: 6px; color: #f8fafc; margin-right: 6px; outline: none; font-size: 11px; font-family: 'JetBrains Mono', monospace; }

        .status-check input:focus { border-color: #00f2fe; }

        .status-check button { padding: 10px 14px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; font-family: 'JetBrains Mono', monospace; transition: background 0.2s; }

        .status-check button:hover { background: #334155; }

        

        .status-result { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 500; display: none; }

        .status-result.approved { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .status-result.pending { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

        .status-result.rejected { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .status-result.not-found { background: rgba(100, 116, 139, 0.1); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    </style>

</head>

<body>

    <div class="container">

        <!-- Terminal Bar Header -->

        <div class="terminal-bar">

            <div class="terminal-dot dot-red"></div>

            <div class="terminal-dot dot-yellow"></div>

            <div class="terminal-dot dot-green"></div>

            <div class="terminal-title">eth0 / hotspot-auth</div>

        </div>



        <div class="header">

            <div class="racing-icon">🖥️</div>

            <h1>Neural Hotspot</h1>

            <p>TKJ Telemetry Gateway</p>

        </div>



        <!-- FORM LOGIN MIKROTIK NATIVE ACTION -->

        <form id="loginForm" name="login" action="$(link-login-only)" method="post">

            <input type="hidden" name="dst" value="$(link-orig)">

            <input type="hidden" name="popup" value="true">



            <div class="form-group">

                <label for="username">Username</label>

                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username driver">

            </div>



            <div class="form-group">

                <label for="password">Password</label>

                <input type="password" id="password" name="password" required placeholder="Masukkan password">

            </div>



            <button type="submit" class="btn" id="submitBtn">

                <span id="btnText">MASUK</span>

            </button>

        </form>



        <div class="message" id="message"></div>



        <div class="status-check" id="statusCheck">

            <p style="margin-bottom: 8px; color: #94a3b8; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;">Cek Telemetri Registrasi:</p>

            <div style="display: flex;">

                <input type="text" id="checkUsername" placeholder="Username Driver">

                <button type="button" onclick="checkStatus()">Cek</button>

            </div>

            <div class="status-result" id="statusResult"></div>

        </div>



        <div class="register-link">

            Belum punya akun? <a href="register.html">Registrasi</a>

        </div>



        <div style="text-align: center; margin-top: 16px;">

            <button type="button" onclick="toggleStatusCheck()" style="background: none; border: none; color: #00f2fe; cursor: pointer; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 600; text-decoration: underline;">

                Cek status registrasi 

            </button>

        </div>

    </div>



    <script>

        // Menggunakan domain Vercel aktif yang terhubung ke database Upstash

        const BACKEND_URL = 'https://mamat-git-main-ahmad5-388c.vercel.app';



        const form = document.getElementById('loginForm');

        const submitBtn = document.getElementById('submitBtn');

        const btnText = document.getElementById('btnText');

        const message = document.getElementById('message');

        const statusCheck = document.getElementById('statusCheck');



        form.addEventListener('submit', async (e) => {

            e.preventDefault();



            const usernameVal = document.getElementById('username').value;

            const passwordVal = document.getElementById('password').value;



            const formData = {

                username: usernameVal,

                password: passwordVal

            };



            submitBtn.disabled = true;

            btnText.innerHTML = '<span class="loading"></span> Connecting Telemetry...';



            try {

                const response = await fetch(`${BACKEND_URL}/api/login`, {

                    method: 'POST',

                    headers: {

                        'Content-Type': 'application/json'

                    },

                    body: JSON.stringify(formData)

                });



                const data = await response.json();



                if (data.success) {

                    showMessage(`System initialized, Driver ${data.user.name}! Login berhasil.`, 'success');

                    

                    setTimeout(() => {

                        showMessage('Masuk ke jalur utama...', 'info');

                        HTMLFormElement.prototype.submit.call(form);

                    }, 1500);

                } else {

                    showMessage(data.message, 'error');

                    submitBtn.disabled = false;

                    btnText.textContent = 'MASUK';

                }

            } catch (error) {

                console.error(error);

                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');

                submitBtn.disabled = false;

                btnText.textContent = 'MASUK';

            }

        });



        function toggleStatusCheck() {

            statusCheck.classList.toggle('show');

        }



        async function checkStatus() {

            const username = document.getElementById('checkUsername').value;

            const statusResult = document.getElementById('statusResult');



            if (!username) {

                statusResult.textContent = 'Masukkan username driver terlebih dahulu';

                statusResult.className = 'status-result not-found';

                statusResult.style.display = 'block';

                return;

            }



            try {

                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);

                const data = await response.json();



                if (data.success) {

                    statusResult.textContent = `Status: ${data.status.toUpperCase()}`;

                    statusResult.className = `status-result ${data.status}`;

                    statusResult.style.display = 'block';



                    if (data.status === 'pending') {

                        statusResult.textContent += ' - Menunggu akses dari System (Admin)';

                    } else if (data.status === 'approved') {

                        statusResult.textContent += ' - Siap terhubung ke jaringan';

                    } else if (data.status === 'rejected') {

                        statusResult.textContent += ' - Akses ditolak';

                    }

                } else {

                    statusResult.textContent = data.message;

                    statusResult.className = 'status-result not-found';

                    statusResult.style.display = 'block';

                }

            } catch (error) {

                statusResult.textContent = 'Gagal mengecek status (Server backend tidak aktif)';

                statusResult.className = 'status-result not-found';

                statusResult.style.display = 'block';

            }

        }



        function showMessage(text, type) {

            message.textContent = text;

            message.className = `message ${type}`;

            message.style.display = 'block';

        }

    </script>

</body>

</html>
