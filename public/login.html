<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Login - TKJ Network Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
:root{--base:#0f1216;--card:#161a20;--panel:#1c2128;--line:#2a303a;--line2:#3b434f;--ember:#ff6a1a;--ember2:#ff8a47;--text:#ece9e3;--muted:#8d949f}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--base);
 background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 8px),radial-gradient(ellipse at 50% -10%,rgba(255,106,26,.10),transparent 55%);
 min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:var(--text);font-family:'Barlow',sans-serif}
.container{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:4px;
 clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%);
 box-shadow:0 30px 60px -20px rgba(0,0,0,.9);padding:36px;width:100%;position:relative}
.terminal-bar{display:flex;align-items:center;gap:8px;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.terminal-dot{width:8px;height:8px;border-radius:1px;transform:rotate(45deg)}
.dot-red{background:#ef4444}.dot-yellow{background:var(--ember)}.dot-green{background:#6b7480}
.terminal-title{margin-left:auto;margin-right:22px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
.header{text-align:center;margin-bottom:26px}
.header h1{font-family:'Barlow Condensed',sans-serif;color:var(--text);font-size:32px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;margin-bottom:6px}
.header p{color:var(--ember2);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.racing-icon{width:56px;height:56px;margin:0 auto 14px;background:rgba(255,106,26,.08);color:var(--ember);border:1px solid rgba(255,106,26,.45);
 border-radius:3px;display:flex;justify-content:center;align-items:center;transform:rotate(45deg)}
.racing-icon svg{width:26px;height:26px;transform:rotate(-45deg)}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:6px;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.06em}
.form-group input{width:100%;padding:12px 14px;background:var(--base);border:1px solid var(--line);border-bottom:2px solid var(--line2);border-radius:3px;
 font-size:14px;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;transition:border-color .15s,background .15s}
.form-group input::placeholder{color:#59616d}
.form-group input:focus{border-color:var(--ember);background:#0b0d10}
.btn{width:100%;padding:13px;background:var(--ember);color:#14110e;border:none;border-radius:3px;font-size:17px;font-weight:700;
 font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;margin-top:6px;transition:background .15s,transform .1s}
.btn:hover{background:var(--ember2)}.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--line);color:#6b7480;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ember2);outline-offset:2px}
.message{padding:12px 16px;border-radius:3px;margin-top:16px;display:none;font-size:12px;font-weight:500;font-family:'JetBrains Mono',monospace}
.message.success{background:rgba(52,211,153,.08);color:#4ade80;border:1px solid rgba(52,211,153,.35)}
.message.error{background:rgba(239,68,68,.08);color:#f87171;border:1px solid rgba(239,68,68,.35)}
.message.info{background:rgba(255,106,26,.08);color:var(--ember2);border:1px solid rgba(255,106,26,.35)}
.register-link,.login-link{text-align:center;margin-top:20px;color:var(--muted);font-size:14px}
.register-link a,.login-link a{color:var(--ember2);text-decoration:none;font-weight:600}
.register-link a:hover,.login-link a:hover{text-decoration:underline}
.loading{display:inline-block;width:10px;height:10px;border:2px solid rgba(20,17,14,.3);border-radius:50%;border-top-color:#14110e;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading{animation-duration:2s}}

.container{max-width:420px}
.link-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:'Barlow',sans-serif;font-weight:500;text-decoration:underline}
.link-btn:hover{color:var(--ember2)}
.status-check{margin-top:16px;padding:16px;background:var(--base);border:1px solid var(--line);border-radius:3px;display:none}
.status-check.show{display:block}
.status-check .sc-title{margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}
.status-check input{width:calc(100% - 66px);padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:3px;color:var(--text);margin-right:6px;outline:none;font-size:12px;font-family:'JetBrains Mono',monospace}
.status-check input:focus{border-color:var(--ember)}
.status-check button{padding:10px 14px;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:3px;cursor:pointer;font-weight:600;font-size:13px;font-family:'Barlow',sans-serif}
.status-check button:hover{border-color:var(--ember);color:var(--ember2)}
.status-result{margin-top:10px;padding:10px;border-radius:3px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:500;display:none}
.status-result.approved{background:rgba(52,211,153,.08);color:#4ade80;border:1px solid rgba(52,211,153,.35)}
.status-result.pending{background:rgba(255,106,26,.08);color:var(--ember2);border:1px solid rgba(255,106,26,.35)}
.status-result.rejected{background:rgba(239,68,68,.08);color:#f87171;border:1px solid rgba(239,68,68,.35)}
.status-result.not-found{background:rgba(141,148,159,.08);color:var(--muted);border:1px solid var(--line2)}
</style>
</head>
<body>
    <div class="container">
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">eth0 / hotspot-auth</div>
        </div>

        <div class="header">
            <div class="racing-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
            <h1>Neural Hotspot</h1>
            <p>TKJ Telemetry Gateway</p>
        </div>

        <!-- FORM LOGIN MIKROTIK NATIVE ACTION -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username driver">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">MASUK</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="status-check" id="statusCheck">
            <p class="sc-title">Cek status registrasi</p>
            <div style="display: flex;">
                <input type="text" id="checkUsername" placeholder="Username Driver">
                <button type="button" onclick="checkStatus()">Cek</button>
            </div>
            <div class="status-result" id="statusResult"></div>
        </div>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Registrasi</a>
        </div>

        <div style="text-align: center; margin-top: 14px;">
            <button type="button" class="link-btn" onclick="toggleStatusCheck()">Cek status registrasi</button>
        </div>
    </div>

    <script>

        // Menggunakan domain Vercel aktif yang terhubung ke database Upstash

        const BACKEND_URL = 'https://mamat-git-main-ahmad5-388c.vercel.app';



        const form = document.getElementById('loginForm');

        const submitBtn = document.getElementById('submitBtn');

        const btnText = document.getElementById('btnText');

        const message = document.getElementById('message');

        const statusCheck = document.getElementById('statusCheck');



        form.addEventListener('submit', async (e) => {

            e.preventDefault();



            const usernameVal = document.getElementById('username').value;

            const passwordVal = document.getElementById('password').value;



            const formData = {

                username: usernameVal,

                password: passwordVal

            };



            submitBtn.disabled = true;

            btnText.innerHTML = '<span class="loading"></span> Connecting Telemetry...';



            try {

                const response = await fetch(`${BACKEND_URL}/api/login`, {

                    method: 'POST',

                    headers: {

                        'Content-Type': 'application/json'

                    },

                    body: JSON.stringify(formData)

                });



                const data = await response.json();



                if (data.success) {

                    showMessage(`System initialized, Driver ${data.user.name}! Login berhasil.`, 'success');

                    

                    setTimeout(() => {

                        showMessage('Masuk ke jalur utama...', 'info');

                        HTMLFormElement.prototype.submit.call(form);

                    }, 1500);

                } else {

                    showMessage(data.message, 'error');

                    submitBtn.disabled = false;

                    btnText.textContent = 'MASUK';

                }

            } catch (error) {

                console.error(error);

                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');

                submitBtn.disabled = false;

                btnText.textContent = 'MASUK';

            }

        });



        function toggleStatusCheck() {

            statusCheck.classList.toggle('show');

        }



        async function checkStatus() {

            const username = document.getElementById('checkUsername').value;

            const statusResult = document.getElementById('statusResult');



            if (!username) {

                statusResult.textContent = 'Masukkan username driver terlebih dahulu';

                statusResult.className = 'status-result not-found';

                statusResult.style.display = 'block';

                return;

            }



            try {

                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);

                const data = await response.json();



                if (data.success) {

                    statusResult.textContent = `Status: ${data.status.toUpperCase()}`;

                    statusResult.className = `status-result ${data.status}`;

                    statusResult.style.display = 'block';



                    if (data.status === 'pending') {

                        statusResult.textContent += ' - Menunggu akses dari System (Admin)';

                    } else if (data.status === 'approved') {

                        statusResult.textContent += ' - Siap terhubung ke jaringan';

                    } else if (data.status === 'rejected') {

                        statusResult.textContent += ' - Akses ditolak';

                    }

                } else {

                    statusResult.textContent = data.message;

                    statusResult.className = 'status-result not-found';

                    statusResult.style.display = 'block';

                }

            } catch (error) {

                statusResult.textContent = 'Gagal mengecek status (Server backend tidak aktif)';

                statusResult.className = 'status-result not-found';

                statusResult.style.display = 'block';

            }

        }



        function showMessage(text, type) {

            message.textContent = text;

            message.className = `message ${type}`;

            message.style.display = 'block';

        }

    </script>
</body>
</html>
