<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Hotspot Login - Pitlane Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ====== TEMA MOTOR BALAP ====== */
        /* Merah racing MotoGP, aksen emas juara, speed streak di aspal gelap */
        :root { --fire:#e10600; --amber:#ffc400; --lime:#8de03c; --red:#ff4d4d; --steel:#9aa0ad; --line:#2e2e36; --white:#f4f4f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 36px 20px; color: var(--white); font-family: 'Barlow', sans-serif;
            background-color:#0d0d0f;background-image:radial-gradient(circle at 50% 0%,rgba(225,6,0,.18),transparent 55%),repeating-linear-gradient(100deg,transparent 0 38px,rgba(255,255,255,.025) 38px 39px,transparent 39px 76px),linear-gradient(135deg,rgba(255,255,255,.03) 25%,transparent 25%),linear-gradient(225deg,rgba(255,255,255,.03) 25%,transparent 25%),linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%),linear-gradient(315deg,rgba(255,255,255,.03) 25%,#0d0d0f 25%);background-position:0 0,0 0,6px 0,6px 0,0 0,0 0;background-size:100% 100%,100% 100%,12px 12px,12px 12px,12px 12px,12px 12px;
        }
        .container {
            position: relative; width: 100%; max-width: 430px; padding: 40px 32px 30px;
            border-radius: 6px; background: linear-gradient(180deg, #1a1a1e 0%, #151518 100%);
            border: 2px solid var(--line); border-left: 6px solid var(--fire);
            box-shadow: 0 25px 50px rgba(0,0,0,.7), 0 0 40px rgba(225,6,0,.1);
        }
        /* Strip bendera balap di atas kartu */
        .spots {
            position: absolute; top: 0; left: 0; right: 0; height: 10px; border-radius: 4px 4px 0 0;
            background: repeating-conic-gradient(#f4f4f6 0 25%, #0b0b0d 0 50%) 0 0 / 20px 20px;
        }
        .terminal-bar { display: flex; align-items: center; gap: 7px; margin-bottom: 22px; }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: var(--red); } .dot-yellow { background: var(--amber); } .dot-green { background: var(--lime); }
        .terminal-title { margin-left: auto; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--steel); }
        .header { text-align: center; margin-bottom: 26px; }
        .racing-icon {
            width: 64px; height: 64px; margin: 0 auto 14px; display: flex; justify-content: center; align-items: center;
            font-size: 30px; border-radius: 6px; background: #0b0b0d; border: 2px solid var(--fire);
            box-shadow: 0 0 0 3px rgba(225,6,0,.2), 0 0 20px rgba(225,6,0,.35); transform: skewX(-8deg);
        }
        .header h1 {
            font-family: 'Teko', sans-serif; font-weight: 600; font-size: 46px; line-height: 1; font-style: italic;
            text-transform: uppercase; letter-spacing: .04em; color: #fff; text-shadow: 3px 3px 0 var(--fire); margin-bottom: 10px;
        }
        .header p {
            display: inline-flex; align-items: center; gap: 10px; font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--amber);
        }
        .header p::before, .header p::after { content: ""; width: 20px; height: 2px; background: var(--amber); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--steel); }
        .form-group input {
            width: 100%; padding: 12px 14px; background: #0b0b0d; border: 2px solid var(--line); border-radius: 4px;
            font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px; font-weight: 600; color: #fff; outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .form-group input::placeholder { color: #5c606b; font-weight: 500; }
        .form-group input:focus { border-color: var(--fire); box-shadow: 0 0 0 3px rgba(225,6,0,.22); }
        .btn {
            width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(180deg, #ff3a30 0%, var(--fire) 55%, #a30400 100%); color: #fff;
            font-family: 'Teko', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1; font-style: italic;
            text-transform: uppercase; letter-spacing: .12em; cursor: pointer; transform: skewX(-10deg);
            box-shadow: 0 4px 0 #7a0300, 0 10px 22px rgba(225,6,0,.3); transition: transform .1s ease, box-shadow .1s ease, filter .2s ease;
        }
        .btn > span { display: inline-block; transform: skewX(10deg); }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: skewX(-10deg) translateY(3px); box-shadow: 0 1px 0 #7a0300; }
        .btn:disabled { background: #2e2e36; color: #7a7f8c; box-shadow: 0 3px 0 #1a1a1e; cursor: not-allowed; }
        .btn:focus-visible, .toggle-status:focus-visible, .status-check button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
        .message { padding: 12px 14px; border-radius: 4px; margin-top: 16px; display: none; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 14px; font-weight: 600; text-align: center; border: 1px solid; border-left-width: 5px; }
        .message.success { background: rgba(141,224,60,.12); color: var(--lime); border-color: var(--lime); }
        .message.error { background: rgba(255,77,77,.12); color: #ff8080; border-color: var(--red); }
        .message.info { background: rgba(255,196,0,.1); color: var(--amber); border-color: var(--amber); }
        .register-link, .login-link { text-align: center; margin-top: 22px; color: var(--steel); font-size: 15px; font-weight: 500; }
        .register-link a, .login-link a { color: var(--amber); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--amber); }
        .register-link a:hover, .login-link a:hover { color: #fff; border-color: #fff; }
        .loading { display: inline-block; width: 14px; height: 14px; border: 3px solid rgba(255,255,255,.35); border-radius: 50%; border-top-color: #fff; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-check { margin-top: 16px; padding: 16px; background: #0b0b0d; border: 2px dashed var(--line); border-radius: 4px; display: none; }
        .status-check.show { display: block; }
        .status-check input { width: calc(100% - 64px); padding: 10px 12px; background: #151518; border: 2px solid var(--line); border-radius: 4px; color: #fff; margin-right: 6px; outline: none; font-size: 14px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif; }
        .status-check input:focus { border-color: var(--fire); }
        .status-check button { padding: 10px 14px; background: var(--amber); color: #0b0b0d; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-family: 'Barlow Semi Condensed', sans-serif; }
        .status-check button:hover { filter: brightness(1.1); }
        .status-result { margin-top: 10px; padding: 10px 12px; border-radius: 4px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13px; font-weight: 600; display: none; border: 1px solid; border-left-width: 5px; }
        .status-result.approved { background: rgba(141,224,60,.12); color: var(--lime); border-color: var(--lime); }
        .status-result.pending { background: rgba(255,196,0,.1); color: var(--amber); border-color: var(--amber); }
        .status-result.rejected { background: rgba(255,77,77,.12); color: #ff8080; border-color: var(--red); }
        .status-result.not-found { background: rgba(154,160,173,.1); color: var(--steel); border-color: #5c606b; }
        .toggle-status { background: none; border: none; color: var(--amber); cursor: pointer; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
        .toggle-status:hover { color: #fff; }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="spots"></div>

        <!-- Bar atas -->
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">eth0 / hotspot-auth</div>
        </div>

        <div class="header">
            <div class="racing-icon">🏍️</div>
            <h1>Pitlane Hotspot</h1>
            <p>TKJ Telemetry Gateway</p>
        </div>

        <!-- FORM LOGIN MIKROTIK NATIVE ACTION -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username driver">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">MASUK</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="status-check" id="statusCheck">
            <p style="margin-bottom: 8px; color: #9aa0ad; font-size: 13px; font-weight: 700;">Cek Telemetri Registrasi:</p>
            <div style="display: flex;">
                <input type="text" id="checkUsername" placeholder="Username Driver">
                <button type="button" onclick="checkStatus()">Cek</button>
            </div>
            <div class="status-result" id="statusResult"></div>
        </div>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Registrasi</a>
        </div>

        <div style="text-align: center; margin-top: 16px;">
            <button type="button" class="toggle-status" onclick="toggleStatusCheck()">
                Cek status registrasi
            </button>
        </div>
    </div>

    <script>
        // Menggunakan domain Vercel aktif yang terhubung ke database Upstash
        const BACKEND_URL = 'https://mamat-git-main-ahmad5-388c.vercel.app';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');
        const statusCheck = document.getElementById('statusCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const formData = {
                username: usernameVal,
                password: passwordVal
            };

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Connecting Telemetry...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`System initialized, Driver ${data.user.name}! Login berhasil.`, 'success');

                    setTimeout(() => {
                        showMessage('Masuk ke jalur utama...', 'info');
                        HTMLFormElement.prototype.submit.call(form);
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'MASUK';
                }
            } catch (error) {
                console.error(error);
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'MASUK';
            }
        });

        function toggleStatusCheck() {
            statusCheck.classList.toggle('show');
        }

        async function checkStatus() {
            const username = document.getElementById('checkUsername').value;
            const statusResult = document.getElementById('statusResult');

            if (!username) {
                statusResult.textContent = 'Masukkan username driver terlebih dahulu';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);
                const data = await response.json();

                if (data.success) {
                    statusResult.textContent = `Status: ${data.status.toUpperCase()}`;
                    statusResult.className = `status-result ${data.status}`;
                    statusResult.style.display = 'block';

                    if (data.status === 'pending') {
                        statusResult.textContent += ' - Menunggu akses dari System (Admin)';
                    } else if (data.status === 'approved') {
                        statusResult.textContent += ' - Siap terhubung ke jaringan';
                    } else if (data.status === 'rejected') {
                        statusResult.textContent += ' - Akses ditolak';
                    }
                } else {
                    statusResult.textContent = data.message;
                    statusResult.className = 'status-result not-found';
                    statusResult.style.display = 'block';
                }
            } catch (error) {
                statusResult.textContent = 'Gagal mengecek status (Server backend tidak aktif)';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        // Tampilkan notifikasi saat kembali dari halaman registrasi
        if (new URLSearchParams(window.location.search).get('registered') === 'success') {
            showMessage('Registrasi berhasil! Menunggu persetujuan admin.', 'success');
        }
    </script>
</body>
</html>
