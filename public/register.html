<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - TKJ Network Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #07090e;
            background-image: 
                radial-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(to right, rgba(16, 185, 129, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .container {
            background: #0d1322;
            border: 1px solid #1e293b;
            border-top: 3px solid #00f2fe;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            padding: 36px;
            max-width: 440px;
            width: 100%;
        }
        .terminal-bar {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .terminal-title {
            margin-left: auto; font-family: 'JetBrains Mono', monospace;
            font-size: 10px; color: #64748b; text-transform: uppercase;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { color: #f8fafc; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .header p { color: #38bdf8; font-size: 11px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 6px; color: #94a3b8;
            font-weight: 600; font-size: 11px; font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%; padding: 11px 14px; background: #07090e;
            border: 1px solid #1e293b; border-radius: 8px; font-size: 13px;
            font-family: 'JetBrains Mono', monospace; color: #f8fafc; outline: none;
        }
        .form-group input:focus { border-color: #00f2fe; box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15); }
        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #00f2fe 0%, #3b82f6 100%);
            color: #07090e; border: none; border-radius: 8px; font-size: 12px;
            font-weight: 700; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
            cursor: pointer; margin-top: 8px;
        }
        .btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
        .message {
            padding: 12px 16px; border-radius: 8px; margin-top: 14px;
            display: none; font-size: 11px; text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }
        .message.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .login-link { text-align: center; margin-top: 20px; color: #64748b; font-size: 12px; }
        .login-link a { color: #00f2fe; text-decoration: none; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .loading {
            display: inline-block; width: 10px; height: 10px;
            border: 2px solid rgba(7, 9, 14, 0.3); border-radius: 50%;
            border-top-color: #07090e; animation: spin 0.8s linear infinite; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">eth0 / hotspot-register</div>
        </div>

        <div class="header">
            <h1>Registrasi Akun</h1>
            <p>TKJ Telemetry Network Interface</p>
        </div>

        <!-- Form Submit Native Langsung ke URL Absolut Vercel -->
        <form id="registerForm" action="https://mamat-git-main-ahmad5-388c.vercel.app/api/register" method="POST">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukkan email">
            </div>
            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" required placeholder="Masukkan nomor telepon">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Konfirmasi password">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', (e) => {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                e.preventDefault(); // Hentikan kirim jika password beda
                showMessage('Password tidak cocok!', 'error');
                return;
            }

            // Izinkan form terkirim secara native
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
